name: Build PR

on: [pull_request]

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install
      - name: Cache webp images
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/webp-images
          key: webp-images-${{ github.run_id }}
          restore-keys: webp-images-
      - name: Build website
        run: yarn build
